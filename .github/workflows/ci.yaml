---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: rkosegi/github-workflows/.github/workflows/go-ci.yaml@d661ba7e21a03d1bbd016928afe5737df58c8aeb # v0.0.2
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
